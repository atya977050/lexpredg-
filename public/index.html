<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لكس | LIVE - المنصة القانونية الملكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; padding-bottom: 90px; }
        .royal-border {
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-btn {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #000;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .gold-btn:hover {
            background: linear-gradient(135deg, #fcf6ba, #d4af37);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }
        /* شريط الأدوات السفلي الثابت الملكي */
        .royal-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 15, 25, 0.95);
            border-top: 2px solid #d4af37;
            backdrop-filter: blur(10px);
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(212, 175, 55, 0.2);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <div class="max-w-4xl mx-auto royal-border rounded-2xl bg-gray-900/95 p-5 backdrop-blur-md mb-8">
        
        <!-- الهيدر الملكي -->
        <header class="text-center border-b border-yellow-600/40 pb-4 mb-4">
            <h1 class="text-2xl md:text-4xl font-black gold-gradient-text mb-1">⚖️ منصة لكس | LIVE الملكية</h1>
            <p class="text-gray-400 text-xs md:text-sm">استشارات قانونية ومهنية مباشرة مع النخبة الاحترافية</p>
            <div class="mt-2 flex justify-center items-center gap-2 text-xs text-yellow-500 bg-yellow-500/10 py-1 px-3 rounded-full w-fit mx-auto border border-yellow-500/30">
                <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                <span>بث مباشر نشط مع المستشارين</span>
            </div>
        </header>

        <!-- نافذة البث المباشر وغرف الدخول -->
        <section class="bg-gradient-to-r from-gray-800 to-gray-900 p-4 rounded-xl border border-yellow-600/30 mb-5">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-bold text-yellow-400 flex items-center gap-2">🎥 بث الغرف المباشرة</h2>
                <span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded-full animate-pulse">🔴 LIVE</span>
            </div>
            
            <div class="bg-black/60 rounded-lg p-3 text-center border border-yellow-500/20 mb-3">
                <p id="current-room-status" class="text-xs text-gray-300">📍 الغرفة الحالية: <span class="text-yellow-400 font-bold">الرئيسية العامة</span></p>
            </div>

            <!-- اختيار الغرف والدخول -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                <button onclick="switchRoom('الرئيسية')" class="gold-btn py-2 px-3 rounded-lg text-center">🏠 الرئيسية</button>
                <button onclick="switchRoom('غرفة المستشار مالك')" class="bg-gray-800 hover:bg-gray-700 text-yellow-400 border border-yellow-500/40 py-2 px-3 rounded-lg font-bold transition">⚖️ مالك الهلباوي</button>
                <button onclick="switchRoom('غرفة المستشارة مرفت')" class="bg-gray-800 hover:bg-gray-700 text-yellow-400 border border-yellow-500/40 py-2 px-3 rounded-lg font-bold transition">⚖️ مرفت الهلباوي</button>
                <button onclick="switchRoom('الأخبار والتقاضي')" class="bg-gray-800 hover:bg-gray-700 text-yellow-400 border border-yellow-500/40 py-2 px-3 rounded-lg font-bold transition">📰 الأخبار القانونية</button>
            </div>
        </section>

        <!-- لوحة الشرف ولعبة النرد (بشكل مدمج) -->
        <div class="grid md:grid-cols-2 gap-4 mb-5">
            <!-- لوحة الشرف المصغرة -->
            <div class="bg-black/50 border border-yellow-600/30 rounded-xl p-3 text-xs">
                <h3 class="font-bold text-yellow-400 mb-2">🏆 لوحة الشرف والتصدر</h3>
                <ul class="space-y-1.5 text-gray-300">
                    <li class="flex justify-between bg-gray-800/50 p-1.5 rounded border border-yellow-500/20"><span>🥇 أحمد القحطاني</span> <span class="text-yellow-400 font-bold">45,200</span></li>
                    <li class="flex justify-between bg-gray-800/50 p-1.5 rounded border border-yellow-500/20"><span>🥈 محمد العتيبي</span> <span class="text-yellow-400 font-bold">32,100</span></li>
                </ul>
            </div>

            <!-- لعبة النرد السريعة -->
            <div class="bg-black/50 border border-yellow-600/30 rounded-xl p-3 text-center flex flex-col justify-between">
                <h3 class="font-bold text-yellow-400 mb-1 text-xs">🎲 لعبة النرد السريعة (حظك اليوم)</h3>
                <div id="dice-result" class="text-2xl font-black gold-gradient-text">🎲 ?</div>
                <button onclick="document.getElementById('dice-result').innerText = '🎲 ' + Math.floor(Math.random() * 6 + 1)" class="gold-btn py-1.5 px-3 rounded-lg font-bold text-xs mt-1">رمي النرد (50 نقطة)</button>
            </div>
        </div>

    </div>

    <!-- شريط الأدوات السفلي الثابت (يحتوي على أيقونات المستشارين والأزرار السريعة) -->
    <div class="royal-bottom-bar py-2 px-4">
        <div class="max-w-4xl mx-auto flex justify-around items-center text-xs">
            
            <!-- زر الرئيسية -->
            <button onclick="alert('أنت في الصفحة الرئيسية')" class="flex flex-col items-center text-yellow-400 hover:text-white transition">
                <span class="text-lg">🏠</span>
                <span class="font-bold">الرئيسية</span>
            </button>

            <!-- أيقونة مصغرة للمستشار مالك -->
            <button onclick="alert('استشارة مباشرة مع المستشار/ مالك الهلباوي - خبير القضايا التجارية والشركات.')" class="flex items-center gap-1.5 bg-yellow-500/10 border border-yellow-500/40 py-1 px-3 rounded-full text-yellow-300 hover:bg-yellow-500/20 transition">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span class="font-bold">⚖️ مالك الهلباوي</span>
            </button>

            <!-- أيقونة مصغرة للمستشارة مرفت -->
            <button onclick="alert('استشارة مباشرة مع المستشارة/ مرفت الهلباوي - خبيرة العقود والتقاضي.')" class="flex items-center gap-1.5 bg-yellow-500/10 border border-yellow-500/40 py-1 px-3 rounded-full text-yellow-300 hover:bg-yellow-500/20 transition">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span class="font-bold">⚖️ مرفت الهلباوي</span>
            </button>

            <!-- زر الغرف والبث -->
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center text-yellow-400 hover:text-white transition">
                <span class="text-lg">📡</span>
                <span class="font-bold">الغرف المباشرة</span>
            </button>

        </div>
    </div>

    <script>
        function switchRoom(roomName) {
            document.getElementById('current-room-status').innerHTML = '📍 الغرفة الحالية: <span class="text-yellow-400 font-bold">' + roomName + '</span>';
            alert('تم الانتقال بنجاح إلى: ' + roomName);
        }
    </script>

</body>
</html>
